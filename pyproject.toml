[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkfit-nl"
version = "0.1.0"
description = "Vehicle-aware parking search for the Netherlands, with camera-confirmed occupancy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cagan Oflazoglu" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.22",
    "pybind11>=3.1.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "onnx>=1.16", "onnxruntime>=1.18", "opencv-python>=4.9", "lightgbm>=4.3", "scikit-learn>=1.4", "pillow>=10.3"]
audit = ["playwright>=1.44", "beautifulsoup4>=4.12"]
pg = ["psycopg[binary]>=3.1", "geoalchemy2>=0.15"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "types-jsonschema"]

[project.scripts]
pf = "parkfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parkfit = ["py.typed"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.12"
packages = ["parkfit"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: hits a live upstream API (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
    "native: requires the compiled parkfit_native extension",
]
